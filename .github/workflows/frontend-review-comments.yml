name: Frontend — address review comments

on:
  pull_request_review_comment:
    types: [created]

concurrency:
  group: frontend-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  address-comment:
    # Пропускаем ответы агента и комментарии к backend-файлам
    if: |
      !contains(github.event.comment.body, '<!-- agent-reply -->') &&
      (contains(github.event.comment.path, 'src/') ||
       contains(github.event.comment.path, 'components/') ||
       contains(github.event.comment.path, 'pages/'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install agent-reviews
        run: npm install -g agent-reviews

      - name: Get comment details
        id: comment
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          agent-reviews --detail ${{ github.event.comment.id }} --json > "$RUNNER_TEMP/comment.json"
          echo "body=$(jq -r '.body' "$RUNNER_TEMP/comment.json")" >> $GITHUB_OUTPUT
          echo "path=$(jq -r '.path' "$RUNNER_TEMP/comment.json")" >> $GITHUB_OUTPUT
          echo "line=$(jq -r '.line' "$RUNNER_TEMP/comment.json")" >> $GITHUB_OUTPUT

      - name: Run frontend agent to address comment
        env:
          COMMENT_BODY: ${{ steps.comment.outputs.body }}
          COMMENT_PATH: ${{ steps.comment.outputs.path }}
          COMMENT_LINE: ${{ steps.comment.outputs.line }}
        run: |
          opencode run "Address this review comment on a React frontend file.
          
          File: $COMMENT_PATH
          Line: $COMMENT_LINE
          Comment: $COMMENT_BODY
          
          Read the file, understand the context, and fix the issue.
          NEVER modify .cs or .csproj files.
          Then run: npm run build && npm test
          If build or tests fail, fix them before proceeding.
          Commit the changes to the current branch."

      - name: Push changes
        run: |
          git config user.name "frontend-agent"
          git config user.email "frontend-agent@bot.local"
          git add .
          if git diff --cached --quiet; then
            echo "No changes made"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "fix: address review comment on ${{ steps.comment.outputs.path }}"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Reply to review comment
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          agent-reviews --reply ${{ github.event.comment.id }} \
            "Fixed in ${{ env.COMMIT_SHA }}. <!-- agent-reply -->"

      - name: Reply if no changes needed
        if: env.HAS_CHANGES != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          agent-reviews --reply ${{ github.event.comment.id }} \
            "Reviewed. No changes needed — this behavior is intentional. <!-- agent-reply -->"